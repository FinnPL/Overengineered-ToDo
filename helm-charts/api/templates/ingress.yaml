{{- range $name, $svc := .Values.services }}
{{- if and ($svc.enabled | default true) ($svc.ingress.enabled | default false) }}
{{- $ctx := dict "root" $ "name" $name "values" $svc -}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "api.serviceFullname" $ctx }}
  labels:
{{ include "api.serviceLabels" $ctx | nindent 4 }}
{{- $annotations := dict -}}
{{- $common := include "api.mergeAnnotations" $ctx }}
{{- if $common }}
{{- $annotations = merge $annotations ($common | fromYaml) -}}
{{- end }}
{{- with $svc.ingress.annotations }}
{{- $annotations = merge $annotations (deepCopy .) -}}
{{- end }}
{{- if gt (len $annotations) 0 }}
  annotations:
{{ toYaml $annotations | nindent 4 }}
{{- end }}
spec:
{{- with $svc.ingress.className }}
  ingressClassName: {{ . }}
{{- end }}
  rules:
    - host: {{ include "api.serviceHost" $ctx }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "api.serviceFullname" $ctx }}
                port:
                  number: {{ $svc.service.port | default 80 }}
{{- if $svc.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ include "api.serviceHost" $ctx }}
      secretName: {{ $svc.ingress.tls.secretName | default (printf "%s-tls" (include "api.serviceFullname" $ctx)) }}
{{- end }}
{{- end }}
{{- end }}
