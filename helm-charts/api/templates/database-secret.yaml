{{- $db := .Values.database | default dict -}}
{{- if and $db.url (not $db.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api.databaseSecretName" (dict "root" . "database" $db) }}
  labels:
{{ include "api.serviceStandardLabels" (dict "root" . "name" "database" "values" dict) | nindent 4 }}
type: Opaque
stringData:
  {{ $db.secretKey | default "database-url" }}: {{ $db.url | quote }}
{{- end }}
